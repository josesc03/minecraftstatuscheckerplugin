# URL del Webhook de Discord donde se enviarán los mensajes de estado.
webhook-url: "TU_WEBHOOK_URL_AQUI"

# Intervalo en segundos para enviar la actualización de estado.
update-interval: 60

# IP o dominio del servidor que se mostrará en el embed.
server-ip: "mc.tu-dominio.com"

# (Opcional) Nombre de usuario para el bot de Discord. Si se deja vacío, se usará el nombre por defecto del webhook.
bot-username: "Server Status"

# (Opcional) URL del avatar para el bot de Discord. Si se deja vacío, se usará el avatar por defecto del webhook.
avatar-url: ""

# El modo de actualización del mensaje en Discord.
# Opciones disponibles:
#   "replace" - Borra el mensaje anterior y envía uno nuevo (comportamiento por defecto).
#   "edit"    - Edita el mensaje existente en lugar de crear uno nuevo.
update-mode: "replace"
